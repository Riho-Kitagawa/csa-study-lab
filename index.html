<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSA Study Lab</title><style>body{margin:0;background:#eef4f1;color:#17352f;font:16px system-ui}header{background:#123e38;color:white;padding:24px}main{max-width:680px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:20px}button,select{font:inherit;padding:12px;border:1px solid #abc5bb;border-radius:10px;margin:6px 0;background:white;color:#17352f}button.primary{background:#176b56;color:white;width:100%}label{display:block;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0}progress,select{width:100%}progress{accent-color:#176b56}small{color:#65766f}</style></head><body><header>PERSONAL CERTIFICATION WORKSPACE<h1>CSA Study Lab</h1>ServiceNow CSA</header><main><section id="home"><h2>学習ダッシュボード</h2><div id="stats"></div><select id="mode"><option value="weak">苦手優先</option><option value="all">全分野</option><option value="new">未回答の問題</option></select><button class="primary" id="start">演習開始（最大10問）</button><button id="export">履歴をエクスポート</button><p><small>Ver.1.1・50問。オリジナル問題・公式教材との原本照合は未実施。履歴は端末内に保存。</small></p></section><section id="quiz" hidden><small id="progress"></small><h2 id="question"></h2><div id="options"></div><label>確信度<select id="conf"><option>迷った</option><option>自信あり</option><option>勘で回答</option></select></label><button class="primary" id="submit">回答する</button><p id="feedback"></p><button class="primary" id="next" hidden>次へ</button><button id="back">ホーム</button></section></main><script>const Q=[[4,"Referenceフィールドが保持する値は？","参照先のsys_id","表示名","レコード番号","テーブル名","参照先レコードのsys_idを保持する。"],[4,"IncidentとTaskの関係は？","テーブル拡張","多対多","Database View","無関係","IncidentはTaskを拡張する。"],[4,"フィールドを読み取るために必要なACL評価は？","レコードとフィールドの両方","レコードのみ","フィールドのみ","どちらか一方","両方のアクセス要件を満たす必要がある。"],[4,"CI間の関係を管理するテーブルは？","cmdb_rel_ci","sys_user","task","sys_update_set","CI間の関係を管理するテーブル。"],[4,"CSDMの目的は？","サービスデータの標準化","認証","画面変更","メール配信","共通のサービスデータモデルを提供する。"],[4,"ACL管理に必要な昇格ロールは？","security_admin","itil","asset","catalog","security_adminへの昇格が必要。"],[4,"Database Viewの用途は？","複数テーブルを結合したレポート","認証","承認","プラグイン削除","複数テーブルのデータを結合して参照する。"],[4,"sys_idが識別するものは？","レコード","テーブル名","更新セット名","表示ラベル","各レコードの一意な識別子。"],[0,"Allメニューの用途は？","モジュールへの移動","データ移送","ACL無効化","バックアップ","アプリとモジュールへのナビゲーション。"],[0,"テーブルの列は何と呼ぶ？","フィールド","レコード","インスタンス","ロール","列はフィールド、行はレコード。"],[1,"PDIとは？","個人開発用インスタンス","本番DB","承認ルール","グループ","Personal Developer Instance。"],[1,"Application Scopeの目的は？","アプリの境界とアクセス管理","画面拡大","メール送信","番号変更","アプリのリソースとアクセスの境界を定義する。"],[2,"リストの表示列を個人向けに調整する機能は？","Personalize List","Discovery","Update Set","MID Server","リストの個人設定を利用する。"],[2,"レポートの用途は？","データの可視化","認証","ACL昇格","テーブル削除","集計や可視化に利用する。"],[2,"グループへのロール付与の利点は？","メンバーへの権限付与を管理できる","ACLを無効化する","sys_idを変更する","DBを複製する","グループ経由でロールを付与できる。"],[3,"Employee Centerの役割は？","従業員向けサービス窓口","DBバックアップ","ACL専用画面","ネットワーク検出","従業員が情報やサービスにアクセスする窓口。"],[3,"HRSDの対象は？","人事サービス","ネットワーク機器","DB移送","IT機器のみ","Human Resources Service Delivery。"],[3,"Catalog Itemの目的は？","サービスや商品の申請","CI検出","ACL昇格","DB結合","サービスや商品を申請する項目。"],[5,"Update Setの用途は？","設定変更の環境間移送","全業務データのバックアップ","認証","CI検出","設定変更を別インスタンスへ移送する。"],[5,"Import Setの役割は？","外部データの一時取り込み","ACL編集","ポータル作成","ロール昇格","外部データをステージングし変換に利用する。"],[4,"IncidentのCallerに登録されたユーザーの氏名が変更された。通常、参照先との紐付けはどうなる？","同じユーザーへの参照が維持される","氏名変更により参照が解除される","新しいユーザーレコードが生成される","Incidentのsys_idが変更される","Referenceは表示名ではなく参照先のsys_idを保持する。"],[4,"RITMとCatalog Taskのテーブル継承について正しいものは？","両方ともTaskを拡張する","Catalog TaskがRITMを拡張する","RITMがCatalog Taskを拡張する","両者はTaskと無関係","レコード間の親子関係とテーブル継承は別。"],[4,"一つの部署に複数のユーザーが所属し、各ユーザーは一つの部署を参照する。関係は？","1対多","多対多","テーブル拡張","Database View","部署側から見ると1対多の関係。"],[4,"複数のユーザーが複数のグループに所属できる関係を実装する方法は？","中間テーブル","テーブル拡張","単一の文字列フィールド","Database Viewのみ","中間テーブルでユーザーとグループの組を管理する。"],[4,"別のテーブルを拡張していないテーブルの分類は？","Base table","Child table","Reference table","Database View","Base tableは他のテーブルを拡張していない。"],[4,"テーブル間の参照や継承関係を視覚的に確認する機能は？","Schema Map","Dependency Views","CI Relationship Editor","Transform Map","Schema Mapはテーブル間の構造的な関係を表示する。"],[4,"Incidentの特定フィールドの内部名や型を確認したい。どこを調べる？","System Dictionary","Number Maintenance","Update Set","CI Class Manager","Dictionaryはフィールド定義などを管理する。"],[4,"レコード番号の接頭辞や採番を管理する機能は？","Number Maintenance","System Dictionary","Schema Map","Access Control","Number Maintenanceは人が読むレコード番号の採番を管理する。"],[4,"ユーザーがテーブルのread ACLを通過したが、特定フィールドのread ACLを通過できない。結果は？","レコードへのアクセスは可能だが対象フィールドは読み取れない","レコードの全フィールドを読み取れる","対象フィールドだけ読み取れる","必ずレコード全体が削除される","レコードへのアクセス許可とフィールドへのアクセス許可は別。"],[4,"incident.--None-- のread ACLが制御する対象は？","Incidentのレコードレベルの読み取り","Incidentの全フィールドの読み取りのみ","Incidentの作成操作","Incidentの添付ファイルのみ","--None--はレコードレベルのACL。"],[4,"特定のフィールドに対するACLがなく、親テーブルにも該当する個別ACLがない場合、フィールドのアクセス評価で候補になるものは？","table.* などのワイルドカードACL","table.--None-- のみ","Number Maintenance","Transform Map","フィールド評価ではワイルドカードのACLも候補となる。"],[4,"レコードの既存値を変更するアクセス制御の操作名は？","write","update","edit","create","ACLの更新操作名はwrite。"],[4,"CIクラスのAttributesでDerivedに表示されるものは？","親クラスから継承された属性","そのクラスで追加した属性のみ","CI間の関係のみ","実際のCIレコード一覧","Derivedは継承された属性。"],[4,"障害のあるサーバーに依存するサービスを視覚的に確認する機能は？","Dependency Views","Schema Map","System Dictionary","Number Maintenance","Dependency ViewsはCI間の依存関係を表示する。"],[4,"ネットワーク内の機器やアプリケーションを検出してCMDBを更新する機能は？","Discovery","Service Catalog","Knowledge Management","Update Set","Discoveryはインフラなどを検出してCI情報を更新する。"],[4,"特定のアプリケーションサービスを構成するCIの依存関係を把握する機能は？","Service Mapping","Schema Map","Number Maintenance","Import Set","Service Mappingはサービスを中心に依存関係を把握する。"],[4,"ServiceNowインスタンスと内部ネットワーク間のDiscovery処理を仲介するコンポーネントは？","MID Server","Service Portal","Database View","Employee Center","MID Serverはインスタンスと外部環境間の処理を仲介する。"],[0,"フォームのヘッダーのコンテキストメニューでSaveを選ぶ一般的な目的は？","保存してフォームに留まる","保存せず一覧へ戻る","別のレコードを削除する","フォームの定義を削除する","従来のフォームUIではSaveは通常保存後もフォームに留まる。"],[1,"本番への反映前に変更を検証する環境として適切なのは？","非本番のテストインスタンス","本番インスタンスのみ","本番のユーザーレコード","Service Portal","非本番環境で変更を検証する。"],[1,"既存の標準フォームのフィールド配置を変更する行為は通常どれに該当する？","Configuration","データ移行","Discovery","認証","標準機能の設定変更はConfigurationの例。"],[2,"リストでActiveがtrueかつPriorityが1のレコードを表示する条件は？","Active is true AND Priority is 1","Active is true OR Priority is 1","Active is false AND Priority is 1","Priority is not 1","両方を満たす必要があるためANDを使用する。"],[2,"Referenceフィールドを経由して参照先の属性を条件に利用する方法は？","Dot-walking","Table extension","Database cloning","Number Maintenance","Dot-walkingは参照関係をたどって属性にアクセスする。"],[2,"他のユーザーとして画面やアクセス権を確認する管理機能は？","Impersonation","Elevate Roles","Discovery","Transform Map","Impersonationは別のユーザーとして動作を確認する機能。"],[3,"従業員がITと人事の申請を一つの窓口から行いたい。適切な機能は？","Employee Center","CAB Workbench","CI Class Manager","Schema Map","Employee Centerは従業員向けの統合窓口。"],[3,"ナレッジ記事を検索・閲覧する専用のベースラインポータルは？","Knowledge Portal","CAB Workbench","Instance Security Center","CI Class Manager","Knowledge Portalはナレッジ記事の利用を支援する。"],[3,"B2B顧客向けのCustomer SupportとB2C向けのCustomer Serviceの違いは？","対象となる顧客の種類","テーブル継承の方式","sys_idの長さ","Update Setの移送方法","B2Bは企業顧客、B2Cは一般消費者向け。"],[3,"カタログ申請後に担当者が実施する作業を個別に管理するレコードは？","Catalog Task","Knowledge Article","Update Set","CI Relationship","Catalog Taskは申請の履行作業を管理する。"],[3,"申請が提出されたときに承認やタスク作成を自動化する機能は？","Flow Designer","Schema Map","Database View","Number Maintenance","Flow Designerはトリガーに応じた処理を自動化する。"],[5,"Import Setの列をターゲットテーブルのフィールドに対応付ける機能は？","Transform Map","Schema Map","Dependency Views","Update Set","Transform Mapは取り込み元とターゲットの対応付けを定義する。"],[5,"開発環境のフォーム設定を本番に移送する際、Update Setを使う目的は？","設定変更をまとめて移送する","全Incidentレコードを複製する","ユーザーのパスワードを同期する","ネットワーク機器を検出する","Update Setは設定変更の移送に用い、一般的な業務データ移行とは異なる。"]],N=['Platform Overview','Instance Configuration','Application Collaboration','Self Service & Automation','Database & Security','Data Migration & Integration'];const $=x=>document.getElementById(x);let H=[],queue=[],p=0,t=0;try{H=JSON.parse(localStorage.getItem('csa-history')||'[]')}catch(e){}N.forEach((n,i)=>$('mode').add(new Option(n,i)));function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function stats(){ $('stats').innerHTML='<h3>'+H.length+' 回答 / '+(H.length?Math.round(H.filter(x=>x.ok).length/H.length*100):0)+'% 正答</h3>'+N.map((n,i)=>{let a=H.filter(x=>Q[x.id]?.[0]===i),v=a.length?Math.round(a.filter(x=>x.ok).length/a.length*100):0;return '<p><small>'+n+' — '+(a.length?v+'%':'未演習')+'</small><progress max="100" value="'+v+'"></progress></p>'}).join('')}function home(){$('home').hidden=false;$('quiz').hidden=true;stats()}function w(i){let a=H.filter(x=>x.id===i).slice(-1)[0];return (a?(!a.ok?(a.conf==='自信あり'?12:8):a.conf!=='自信あり'?5:0):4)+(Q[i][0]===4?2:0)}$('start').onclick=()=>{let m=$('mode').value;queue=shuffle(Q.map((_,i)=>i).filter(i=>m==='new'?!H.some(x=>x.id===i):m==='weak'||m==='all'||Q[i][0]===Number(m)));if(m==='weak')queue.sort((a,b)=>w(b)-w(a));queue=queue.slice(0,10);if(!queue.length){alert('対象の問題がありません');return}p=0;$('home').hidden=true;$('quiz').hidden=false;show()};function show(){let q=Q[queue[p]];t=Date.now();$('progress').textContent=N[q[0]]+' · '+(p+1)+' / '+queue.length;$('question').textContent=q[1];$('options').innerHTML='';shuffle([2,3,4,5]).forEach(i=>{let l=document.createElement('label'),r=document.createElement('input');r.type='radio';r.name='answer';r.value=i;l.append(r,document.createTextNode(' '+q[i]));$('options').append(l)});$('conf').disabled=false;$('conf').value='迷った';$('feedback').textContent='';$('submit').hidden=false;$('next').hidden=true}$('submit').onclick=()=>{let r=document.querySelector('input[name=answer]:checked');if(!r)return;let id=queue[p],q=Q[id],ok=Number(r.value)===2;H.push({id,ok,selected:q[Number(r.value)],conf:$('conf').value,seconds:Math.round((Date.now()-t)/1000),date:new Date().toISOString()});let msg='';try{localStorage.setItem('csa-history',JSON.stringify(H))}catch(e){msg='（履歴保存失敗）'}$('feedback').textContent=(ok?'正解！':'不正解。正解：'+q[2])+' '+q[6]+msg;document.querySelectorAll('input[name=answer]').forEach(r=>r.disabled=true);$('conf').disabled=true;$('submit').hidden=true;$('next').hidden=false;$('next').textContent=p===queue.length-1?'結果を見る':'次へ'};$('next').onclick=()=>{if(++p<queue.length)show();else home()};$('back').onclick=home;$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(H,null,2)],{type:'application/json'}));a.download='csa-history.json';a.click()};stats();</script></body></html>
